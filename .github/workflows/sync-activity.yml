name: Sync Azure DevOps activity

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview matching commits without publishing"
        type: boolean
        default: false
      repair_format:
        description: "Upgrade old activity rows using Azure metadata (one bot commit)"
        type: boolean
        default: false
      since:
        description: "Optional UTC start date for historical backfill (YYYY-MM-DD)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: azure-devops-activity-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Validate private destination
        env:
          ACTIVITY_REPOSITORY: ${{ secrets.ACTIVITY_REPOSITORY }}
          ACTIVITY_REPOSITORY_TOKEN: ${{ secrets.ACTIVITY_REPOSITORY_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$ACTIVITY_REPOSITORY"
          test -n "$ACTIVITY_REPOSITORY_TOKEN"
          test "$ACTIVITY_REPOSITORY" != "$SOURCE_REPOSITORY"
          GH_TOKEN="$ACTIVITY_REPOSITORY_TOKEN" gh api "repos/$ACTIVITY_REPOSITORY" --jq '.private' | grep -qx true
      - uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0
      - name: Checkout private destination
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.ACTIVITY_REPOSITORY }}
          token: ${{ secrets.ACTIVITY_REPOSITORY_TOKEN }}
          path: destination
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements.txt
      - run: pip install -r source/requirements.txt
      - name: Sync activity
        working-directory: source
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          AZURE_DEVOPS_ORGANIZATION: ${{ secrets.AZURE_DEVOPS_ORGANIZATION }}
          AZURE_AUTHOR_EMAILS: ${{ secrets.AZURE_AUTHOR_EMAILS }}
          GITHUB_COMMIT_EMAIL: ${{ secrets.SYNC_GIT_EMAIL }}
          GITHUB_COMMIT_NAME: ${{ vars.SYNC_GIT_NAME }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPAIR_FORMAT: ${{ inputs.repair_format }}
          SINCE: ${{ inputs.since }}
        run: |
          export GITHUB_DEFAULT_BRANCH="$(git -C ../destination branch --show-current)"
          test -n "$GITHUB_DEFAULT_BRANCH"
          if [[ "$REPAIR_FORMAT" == "true" && ( "$DRY_RUN" == "true" || -n "$SINCE" ) ]]; then
            echo "repair_format cannot be combined with dry_run or since" >&2
            exit 1
          fi
          if [[ "$REPAIR_FORMAT" == "true" ]]; then
            export GITHUB_COMMIT_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
            export GITHUB_COMMIT_NAME="github-actions[bot]"
            python -m src.main --destination ../destination --repair-format
            exit
          fi
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ -n "$SINCE" ]]; then args+=(--since "$SINCE"); fi
          python -m src.main --destination ../destination "${args[@]}"

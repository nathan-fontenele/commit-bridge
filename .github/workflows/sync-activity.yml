name: Sync Azure DevOps activity

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview matching commits without publishing"
        type: boolean
        default: false
      since:
        description: "Optional UTC start date for historical backfill (YYYY-MM-DD)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: azure-devops-activity-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Require a private destination
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: test "$REPOSITORY_PRIVATE" = "true"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sync activity
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          GITHUB_COMMIT_EMAIL: ${{ secrets.GITHUB_COMMIT_EMAIL }}
          GITHUB_COMMIT_NAME: ${{ vars.GITHUB_COMMIT_NAME }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
          SINCE: ${{ inputs.since }}
        run: |
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ -n "$SINCE" ]]; then args+=(--since "$SINCE"); fi
          python -m src.main "${args[@]}"
